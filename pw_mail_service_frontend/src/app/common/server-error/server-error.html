<main class="error-page">
  <section class="error-card" aria-labelledby="error-title">
    <a class="brand" href="/" aria-label="Postwell home">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>postwell</span>
    </a>

    <div class="error-illustration" aria-hidden="true">
      <span class="error-number">500</span>
      <span class="error-spark spark-left">✦</span>
      <span class="error-spark spark-right">✳</span>
      <span class="error-dot"></span>
    </div>

    <p class="eyebrow">A little hiccup</p>
    <h1 id="error-title">Something went wrong</h1>
    <p class="message">
      We hit an unexpected problem while loading this page. Your mail is still safe—please try
      again in a moment.
    </p>

    <div class="error-actions">
      <button class="retry-button" type="button" onclick="window.location.reload()">Try again <span aria-hidden="true">↻</span></button>
      <a class="home-link" href="/">Back to home</a>
    </div>
  </section>

  <p class="page-note"><span aria-hidden="true">✦</span> A little more calm for your inbox.</p>
</main>
